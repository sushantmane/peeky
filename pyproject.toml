[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peeky"
version = "0.1.0"
description = "A debugger worker and runtime experimentation client for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["debugpy==1.8.21"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-timeout==2.4.0", "ruff==0.14.0", "build==1.3.0"]

[project.scripts]
peeky-worker = "peeky.worker:main"
peeky-agent = "peeky.agent:main"
peeky-probe = "peeky.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib -ra"
timeout = 45
markers = ["integration: launches a real debugger and target process"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
