[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peeky"
version = "0.1.0"
description = "A debugger worker and runtime experimentation client for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["debugpy==1.8.22"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-timeout==2.4.0", "ruff==0.17.0", "build==1.6.1"]

[project.scripts]
peeky-worker = "peeky.worker:main"
peeky-agent = "peeky.agent:main"
peeky-probe = "peeky.probe:main"
peeky = "peeky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib -ra"
timeout = 45
markers = ["integration: launches a real debugger and target process"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Third-party programs kept byte-for-byte as real debugging targets.
extend-exclude = ["examples/real/*/ipaddress39.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
