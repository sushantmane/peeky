[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "peeky"
dynamic = ["version"]
description = "A debugger worker and runtime experimentation client for coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sushant Mane" }]
dependencies = ["debugpy==1.8.22"]

[project.urls]
Homepage = "https://github.com/sushantmane/peeky"
Source = "https://github.com/sushantmane/peeky"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-timeout==2.4.0", "ruff==0.17.2", "build==1.6.1"]

[project.scripts]
peeky-worker = "peeky.worker:main"
peeky-agent = "peeky.agent:main"
peeky-probe = "peeky.probe:main"
peeky = "peeky.cli:main"

[tool.setuptools.dynamic]
# The one source of the version: `peeky --version` and the package metadata both read it.
version = { attr = "peeky.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib -ra"
timeout = 45
markers = [
    "integration: launches a real debugger and target process",
    "cpp: a C++ case, in tests/cpp or tests/native (the cpp-gcc lanes run them with g++)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Third-party programs kept byte-for-byte as real debugging targets.
extend-exclude = ["examples/real/*/ipaddress39.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
