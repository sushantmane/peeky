# Buildkite: CI while GitHub Actions is paused by the account's billing limit.
#
# Every push runs the quick checks on a Buildkite hosted Linux agent. The free plan has only the
# small size (2 vCPU, 4 GB) and 2,000 vCPU minutes a month; these checks take about 10 minutes.
#
# The full lanes (scripts/ci_linux/run_lanes.sh: C, C++, Rust, GDB, Java and the wheel) would take
# an estimated 2 hours on that size, so they run only when asked: start a build with
# PEEKY_FULL_LANES=1, or from a schedule.
steps:
  - label: ":python: quality, unit and integration"
    key: quick
    timeout_in_minutes: 40
    command: .buildkite/quick.sh

  - label: ":docker: full Linux lanes"
    key: full
    if: build.env("PEEKY_FULL_LANES") == "1" || build.source == "schedule"
    timeout_in_minutes: 240
    command: .buildkite/full.sh
