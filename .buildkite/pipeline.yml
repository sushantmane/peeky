# Buildkite: CI while GitHub Actions is paused by the account's billing limit.
#
# Both steps run on every build, in parallel, on Buildkite hosted Linux agents. The free plan has
# only the small size (2 vCPU, 4 GB) and 2,000 vCPU minutes a month.
# - quick: quality, unit and integration, about 10 minutes.
# - full: every Linux lane (scripts/ci_linux/run_lanes.sh: C, C++, Rust, GDB, Java and the wheel),
#   an estimated 2 hours on that size, so the free minutes cover only a few builds a month.
#   To save minutes, add `if: build.env("PEEKY_FULL_LANES") == "1"` to it.
steps:
  - label: ":python: quality, unit and integration"
    key: quick
    timeout_in_minutes: 40
    command: .buildkite/quick.sh

  - label: ":docker: full Linux lanes"
    key: full
    timeout_in_minutes: 300
    command: .buildkite/full.sh
