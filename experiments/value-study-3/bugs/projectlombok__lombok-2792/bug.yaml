upstream: https://github.com/projectlombok/lombok/pull/2792
category: D
categories_applicable: [D, B]
category_rationale: >-
  The error needs a particular nesting, a val inside a lambda that is an argument in another
  val's initializer, and comes from the order in which lombok's javac handler visits nested
  locals relative to javac's attribution of the outer initializer.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The outer val's type can't be resolved because the inner vals in its lambda aren't handled yet
  when it is, and the fix changes that order; the handler runs inside javac's annotation
  processing of the test input, which the test harness drives, far below the test method.
root_cause: >-
  The javac HandleVal handler replaces `val`/`var` on a local variable by resolving its
  initializer's type, and it did so in visitLocal, which runs before the local's children are
  visited. When the initializer holds a lambda whose body declares its own `val`, that inner val
  is still unresolved while the outer initializer is attributed, so the outer type can't be
  resolved and lombok reports "Cannot use 'val' here ... Type cannot be resolved". The fix
  handles locals in endVisitLocal instead, after their children.
test_hint: >-
  Lombok builds with ant on JDK 11, offline: `cd /testbed && ant test.compile` compiles lombok and
  its tests, and `ant test.javacCurrent` runs the javac test suites.
image: peeky-study/projectlombok__lombok-2792:control
