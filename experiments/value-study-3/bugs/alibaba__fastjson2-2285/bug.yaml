category: E
categories_applicable: [E]
category_rationale: >-
  The report shows an enum's @JSONType serializer ignored for an enum-typed field and points at
  the writer's annotation processing; the state is one flag in the enum class's bean info.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The field is written as the enum's name instead of the custom serializer's output, and the fix
  changes a flag that decides which field writer is built. The fixed code runs while the writer
  for the containing class is created, through the provider, the (ASM) writer creator and the
  module's getBeanInfo, more than five calls below toJSONString.
root_cause: >-
  When fastjson2 creates the field writer for an enum-typed field (ObjectWriterCreator and
  ObjectWriterCreatorASM.createFieldWriter), it reads the enum class's BeanInfo and builds the
  plain FieldWriterEnum, which writes the constant's name, unless beanInfo.writeEnumAsJavaBean is
  set. ObjectWriterBaseModule.getBeanInfo records a @JSONType serializer on the class
  (beanInfo.serializer) but doesn't set that flag, so an enum's custom serializer is skipped. The
  fix also sets writeEnumAsJavaBean when @JSONType names a serializer.
test_hint: >-
  fastjson2 builds with its Maven wrapper on JDK 11, offline: run tests of the core module with
  `cd /testbed && ./mvnw -o -pl core test -Dtest=<TestClass>` (or `-Dtest=<TestClass>#<method>`).
