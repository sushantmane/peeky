category: D
categories_applicable: [D]
category_rationale: >-
  The wrong output needs a particular sequence: a global default collector, then a scoped
  default that is itself a NoCollector. The faulty value is the thread-local current dispatcher,
  which the dispatch code replaces lazily.
traits: [runtime-state]
traits_rationale: >-
  The report shows wrong output (an event is recorded while a NoCollector is the default), and
  the fix changes how the thread's current dispatcher is kept and filled in across calls. The
  test calls the dispatcher directly, a few calls deep, on its own thread.
root_cause: >-
  In tracing-core/src/dispatch.rs, the thread-local State keeps the thread's default as a
  Dispatch and uses a NoCollector dispatch (Dispatch::none()) to mean "never set": get_default
  and Entered::current replace a NoCollector default with the global dispatcher. So a scoped
  default that really is a NoCollector (with_default or set_default of NoCollector) is taken
  for unset and swapped for the global collector, which then records the events. The fix keeps
  an Option<Dispatch>, None meaning unset, fills it from the global default once, and stores
  Some(..) in set_default and when a DefaultGuard drops.
test_hint: >-
  Run a crate's tests with `cd /testbed && cargo test -p <crate>` (e.g. `cargo test -p
  tracing`); one integration test file with `cargo test -p <crate> --test <file stem>` (in
  <crate>/tests/).
