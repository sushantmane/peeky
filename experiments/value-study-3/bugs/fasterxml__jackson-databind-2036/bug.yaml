id: fasterxml__jackson-databind-2036
language: java
repo: fasterxml/jackson-databind
source: Multi-SWE-bench
base_commit: bfeb1fa9dc4c889f8027b80abb2f77996efd9b70
upstream: https://github.com/FasterXML/jackson-databind/pull/2036
category: E
categories_applicable: [E]
category_rationale: >-
  A feature request: the report says what should happen when the type property is missing and a
  concrete class is requested, and the default implementation is chosen in one place
  (StdTypeResolverBuilder.buildTypeDeserializer), with simple state.
traits: [hard-to-reach]
traits_rationale: >-
  The fix adds a new DeserializationFeature, a missing feature rather than a wrongly computed
  value, so not runtime-state; the type deserializer is built in StdTypeResolverBuilder, reached
  through the deserializer factory more than 5 calls below ObjectReader.readValue.
root_cause: >-
  With @JsonTypeInfo, StdTypeResolverBuilder.buildTypeDeserializer picks a default implementation
  only when the annotation's defaultImpl names one; otherwise there is none, so JSON without the
  type id fails even when the caller asked for a concrete class. The fix adds
  DeserializationFeature.USE_BASE_TYPE_AS_DEFAULT (off by default) and moves the choice into a new
  defineDefaultImpl method, which uses the requested base type as the default implementation when
  the feature is on, no defaultImpl is given and the base type isn't abstract.
test_hint: >-
  jackson-databind builds with Maven on JDK 11, offline (dependencies are in ~/.m2): run a test
  class with `cd /testbed && mvn -o test -Dtest=<TestClass>`; `mvn -o test` runs the whole suite
  (about 1.5 minutes; two test classes already fail at the base commit on JDK 11).
