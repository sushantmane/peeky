category: E
categories_applicable: [E]
category_rationale: >-
  The report quotes both the documentation of ZSTD_CCtx_reset and the code that resets only the
  stream stage, the pledged size and the dictionary; the missing reset of parameters is plain.
traits: []
traits_rationale: >-
  An API addition for a documentation mismatch, not a wrong computed value: not runtime-state.
  Building and running the failing test program takes about 1.3 minutes; ZSTD_createCCtx_advanced
  runs directly from the test's first call.
root_cause: >-
  lib/zstd.h documents ZSTD_CCtx_reset as returning all parameters to their defaults, but in
  lib/compress/zstd_compress.c it only resets the stream stage and the pledged source size (through
  ZSTD_startNewCompression) and drops the dictionary, so no call restores the default parameters.
  The fix adds ZSTD_CCtx_resetParameters, which (refused during a compression) drops the
  dictionary and resets requestedParams with ZSTD_CCtxParams_reset; ZSTD_createCCtx_advanced
  initialises its parameters through it, ZSTD_CCtx_reset only ends the current compression (taking
  ZSTD_startNewCompression's place), and zstd.h documents both.
test_hint: |-
  Build with `cd /testbed && make -j4` (library and CLI). The test programs are in tests/: `cd /testbed && make -C tests test` builds and runs them all, or run one `test-<name>` target of tests/Makefile.
  The fuzzers run for a set time; shorten it with `FUZZERTEST=-T30s ZSTREAM_TESTTIME=-T30s`.
