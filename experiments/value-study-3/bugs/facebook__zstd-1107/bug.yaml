notes: >-
  Multi-SWE-bench's FAIL_TO_PASS and PASS_TO_PASS are empty, and its n2p tests (the pool tests
  testInvalid, testOrder) aren't touched by the test patch, so fail_to_pass is the test the test
  patch changes: test-fuzzer (tests/fuzzer.c), the make target eval.sh runs, its time shortened
  (-T1mn from -T200s). At base the test patch's fuzzer.c doesn't build (it calls the function the
  fix adds). GCC 13 replaces Ubuntu 20.04's GCC 9. The Peeky build (peeky.sh) builds
  tests/fuzzer in place with clang 18 at -O0, through tests/Makefile (which compiles the library's
  objects one by one and fuzzer.c in its link command). Reach: run corrected once, since the test
  patch's fuzzer.c can't be built at base; the corrected run is the fuzzer built from base's
  fuzzer.c (see reach.json's notes): a decision for the study, as the hidden lines don't run.
