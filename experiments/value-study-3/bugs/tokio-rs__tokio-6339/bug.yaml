category: E
categories_applicable: [E]
category_rationale: >-
  The report shows the exact input that doesn't compile (a select! with only an else branch) and
  proposes the fix; it is a missing macro rule, with no runtime state.
traits: [hard-to-reach]
traits_rationale: >-
  A compile error for a missing macro form, so not runtime-state; builds fast. The fixed code is a
  macro_rules arm, which runs only in its expansion at the call site.
root_cause: >-
  tokio's select! macro (tokio/src/macros/select.rs) has entry rules only for one or more
  `pattern = future => handler` branches, optionally after `biased;`, and an empty-input rule that
  raises a compile error; an invocation with only an `else => expr` branch matches none of them.
  The fix adds an entry rule `($(biased;)? else => $else:expr $(,)?)` that expands to the else
  expression.
test_hint: >-
  Run an integration test file with `cd /testbed && cargo test --test <file stem>` (integration
  tests are in tokio/tests/, e.g. `cargo test --test sync_mpsc`); tokio's unit tests with
  `cargo test -p tokio --lib --features full`.
