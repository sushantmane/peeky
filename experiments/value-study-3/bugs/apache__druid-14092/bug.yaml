notes: >-
  JDK 11 per the SWE-bench spec; its install step (`mvn clean install -pl
  processing,cloud/aws-common,cloud/gcp-common -DskipTests -am`), then the server module's
  dependencies fetched by running its existing test once. Maven 3.8 from the base instead of mvnd,
  offline via /root/.m2/settings.xml. eval.sh runs each test command even if an earlier one fails
  (the dataset chains them with &&). Surefire reruns a failing test 3 times (the project's
  setting), so a failing run shows Run 1 to 4. Not A: the server module's offline test run takes
  about 25 s in a 4-CPU container.
