category: D
categories_applicable: [D, B]
category_rationale: >-
  The failure needs a particular configuration: a JSONB round trip with WriteClassName and
  FieldBased features, a context auto-type allow-list handler, and an EnumSet field, whose runtime
  class is the JDK's package-private RegularEnumSet with no public constructor.
traits: [runtime-state]
traits_rationale: >-
  The report shows a crash when reading back an EnumSet field, and the fix changes how the
  collection instance for that field is chosen and built.
root_cause: >-
  When fastjson2 reads a JSONB collection whose written class name is java.util.RegularEnumSet,
  ContextAutoTypeBeforeHandler's table of basic types has only EnumSet itself, so the auto-type
  check rejects the concrete class; and ObjectReaderImplList.readJSONBObject then tries
  listType.newInstance() on it, which fails because RegularEnumSet has no no-arg constructor. The
  fix adds the concrete enum-set class to the handler's basic types and, in readJSONBObject, reads
  any EnumSet subtype into a HashSet and builds the result with EnumSet.copyOf.
test_hint: >-
  fastjson2 builds with its Maven wrapper on JDK 8, offline: run tests of the core module with
  `cd /testbed && ./mvnw -o -pl core test -Dtest=<TestClass>` (or `-Dtest=<TestClass>#<method>`).
