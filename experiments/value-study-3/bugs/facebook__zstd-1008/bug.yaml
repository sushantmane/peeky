notes: >-
  Multi-SWE-bench's FAIL_TO_PASS and PASS_TO_PASS are empty, and its n2p tests (the pool tests
  testInvalid, testOrder) aren't touched by the test patch, so fail_to_pass is the tests the test
  patch changes: test-fuzzer (tests/fuzzer.c) and test-zstream (tests/zstreamtest.c), run in
  `make test`'s order and stopping at the first failure, times shortened (-T1mn, -T30s), as for
  facebook__zstd-836. At base test-fuzzer passes (its changed static-CDict test reads past the
  buffer without crashing) and test-zstream segfaults in the test patch's "dictionary source size
  and level"; with the fix both pass. A fail_to_pass test passes at base, so the candidate is
  ineligible (dropped at step 1). GCC 13 replaces Ubuntu 20.04's GCC 9.
