categories_applicable: [E, B]
category_rationale: >-
  The report's stack trace points at ReflectUtils.getReturnTypes and the cast that fails; the
  state is one method's generic return type, though it takes java.lang.reflect's TypeVariable to
  see why.
traits: [runtime-state]
traits_rationale: >-
  getReturnTypes crashes with a ClassCastException for a CompletableFuture of a type variable, and
  the fix changes how it computes the return types in that case.
root_cause: >-
  ReflectUtils.getReturnTypes (dubbo-common) unwraps a Future's type argument and casts it to
  Class unless it is a ParameterizedType, so for a method returning CompletableFuture<T> the
  argument is a TypeVariable and the cast throws ClassCastException. The fix adds a TypeVariable
  branch: the raw return type is the variable's first bound (Object by default), and the generic
  return type is the variable itself.
test_hint: >-
  Dubbo builds with Maven on JDK 17, offline (dubbo-common and the poms it needs are installed in
  ~/.m2): run a test of dubbo-common with
  `cd /testbed && mvn test -o -pl dubbo-common -Dtest=<TestClass>` (or `-Dtest=<TestClass>#<method>`).
