category: D
categories_applicable: [D]
category_rationale: >-
  The wrong headings need a particular configuration: derive structs flattened into one parser,
  each with a struct-level help_heading. The faulty order is in the code the derive macro
  generates, not in clap's runtime.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The report shows wrong output (arguments under the wrong section), and the fix changes the order
  in which the heading is applied relative to the arguments. The fixed code runs inside the
  clap_derive proc macro, at compile time, and acts through the code it generates.
root_cause: >-
  In clap_derive, a struct-level #[clap(help_heading = ...)] is kept as a generic method and
  emitted by Attrs::top_level_methods, which gen_augment (src/derives/args.rs, and
  src/derives/subcommand.rs) appends to the App after all of the struct's arguments are added.
  App::help_heading applies to the arguments added after it, so a flattened struct's heading
  lands on the next struct's arguments, not its own. The fix parses help_heading as its own
  attribute (parse.rs, attrs.rs) and emits it before the arguments (initial_top_level_methods)
  and on fields, keeping the other top-level methods at the end.
test_hint: >-
  Run the tests with `cd /testbed && RUSTFLAGS=-Awarnings cargo test --test <name>` (e.g. `--test
  flags`; one test target per file in tests/), the library's unit tests with `cargo test --lib`,
  and the workspace's other crates with `cargo test -p <crate>` (clap_derive, clap_generate,
  clap_generate_fig); the build cache was made with these RUSTFLAGS.
