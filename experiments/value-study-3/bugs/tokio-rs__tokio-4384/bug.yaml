category: B
categories_applicable: [B, E]
category_rationale: >-
  The compiler error comes from std's auto-trait rules: UnwindSafe and RefUnwindSafe are lost
  through the UnsafeCell and atomics deep in the I/O driver's registration. The report's error
  chain shows where (PollEvented), so the fix site is clear.
traits: []
traits_rationale: >-
  A compile-time trait bound, not a runtime value; it builds and tests in well under 3 minutes,
  and nothing runs at runtime.
root_cause: >-
  tokio's network types (TcpListener, TcpStream, UdpSocket, the Unix types) wrap
  PollEvented<E> (tokio/src/io/poll_evented.rs), whose Registration holds slab references to
  ScheduledIo with UnsafeCell and atomic fields, so the compiler doesn't derive UnwindSafe or
  RefUnwindSafe for them and they can't cross catch_unwind. The fix declares
  `impl<E: Source> UnwindSafe for PollEvented<E> {}` and `impl<E: Source> RefUnwindSafe for
  PollEvented<E> {}`.
test_hint: >-
  Run an integration test file with `cd /testbed && cargo test --test <file stem>` (integration
  tests are in tokio/tests/, e.g. `cargo test --test sync_mpsc`); tokio's unit tests with
  `cargo test -p tokio --lib --features full`.
