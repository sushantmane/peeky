notes: >-
  JDK 11 and Maven as in Multi-SWE-bench's image (the base's OpenJDK 11 and Maven 3.8 instead of
  Ubuntu 22.04's), offline via /root/.m2/settings.xml. The dataset's FAIL_TO_PASS and PASS_TO_PASS
  are empty, and its n2p tests are in other modules (extras, proto), not in the test patch:
  Multi-SWE-bench's parser expects surefire 2's lines, and this gson module's surefire 3.0.0-M7
  prints "[INFO] Tests run: ..., Time elapsed: 0.03 s", so it read none of the gson module's
  classes. So fail_to_pass is the class the test patch changes (ReadersWritersTest; it adds
  testToJsonAppendable and reformats two tests), and parse.py is Multi-SWE-bench's gson parser
  with Maven's log prefixes stripped and "s" accepted as the time unit. eval.sh runs a clean
  `test` of the gson module only, limited to the hidden test class, instead of the whole
  project's `clean test`; pass_to_pass is empty (the dataset has none). Test names are classes,
  as in Multi-SWE-bench's parser.
