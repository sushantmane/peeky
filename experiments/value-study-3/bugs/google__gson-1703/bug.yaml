category: E
categories_applicable: [E]
category_rationale: >-
  The report names the cause: the CharSequence Gson passes to a non-Writer Appendable doesn't
  implement toString; reading Streams.AppendableWriter confirms it, with one char array as state.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The Appendable receives wrong text (pieces of a class name instead of the JSON), and the fix
  changes the string the CharSequence gives back, cached until its array changes. The fixed code
  runs inside the Writer that Gson wraps around the Appendable, below Gson.toJson, the type
  adapters, JsonWriter and Writer.write, more than five calls deep.
root_cause: >-
  When Gson.toJson is given an Appendable that isn't a Writer, Streams.writerForAppendable wraps it
  in an AppendableWriter, whose write(char[], int, int) hands the Appendable a CurrentWrite: a
  mutable CharSequence over the current char array. CurrentWrite doesn't override toString, so an
  Appendable that calls csq.toString() (as the CharSequence contract allows) gets Object's identity
  string and appends slices of it instead of the JSON. The fix adds toString, returning the array
  as a String, cached until setChars replaces the array.
test_hint: >-
  Gson builds with Maven on JDK 11, offline (the gson module and its parent pom are installed in
  ~/.m2): run a test of the gson module with
  `cd /testbed && mvn test -o -pl gson -Dtest=<TestClass>` (or `-Dtest=<TestClass>#<method>`).
