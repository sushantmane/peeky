notes: >-
  Rust 1.96 (the base image's toolchain) builds and tests it. tokio doesn't commit Cargo.lock;
  Multi-SWE-bench resolves afresh, so the image pins SWE-bench's lock file for tokio-6551,
  completed by Cargo 1.96 for this commit (Cargo.lock here; git ignores it). The dataset's
  FAIL_TO_PASS and PASS_TO_PASS are empty and its n2p tests are all from other test binaries
  (its run stopped at the first failing binary), so fail_to_pass is the test the test patch adds
  and pass_to_pass is empty, as the dataset gives it. eval.sh runs the sync_watch binary alone,
  offline. The hidden test doesn't compile at base (it calls mark_unchanged).
