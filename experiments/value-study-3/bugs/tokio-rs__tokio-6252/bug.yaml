category: E
categories_applicable: [E]
category_rationale: >-
  A feature request: a method that marks a watch receiver's current value as seen. What it must
  do is clear from the report and from mark_changed and borrow_and_update; the state is one
  version number.
traits: []
traits_rationale: >-
  An API addition, so not runtime-state; it builds and tests in well under 3 minutes, and the new
  method runs directly in the test.
root_cause: >-
  tokio/src/sync/watch.rs has no way to mark a Receiver's current value as seen without taking
  the value's read lock (borrow_and_update). The fix adds Receiver::mark_unchanged, which loads
  the shared state's current version and stores it as the receiver's version, so has_changed()
  returns false and changed() waits for the next send.
test_hint: >-
  Run an integration test file with `cd /testbed && cargo test --test <file stem>` (integration
  tests are in tokio/tests/, e.g. `cargo test --test sync_mpsc`); tokio's unit tests with
  `cargo test -p tokio --lib --features full`.
