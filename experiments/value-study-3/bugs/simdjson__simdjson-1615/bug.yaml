notes: >-
  Build follows Multi-SWE-bench's simdjson recipe (cmake -DSIMDJSON_DEVELOPER_MODE=ON in build/,
  ctest) with GCC 11 (Ubuntu's gcc-11 for its gcc:11 image; developer mode compiles with -Werror),
  limited to the test binary the test patch adds. fail_to_pass is that n2p test,
  ondemand_json_pointer_tests (it doesn't compile at base). The test patch also re-indents the
  add_cpp_test lines of ondemand_tostring_tests and ondemand_misc_tests (whitespace only): those
  tests aren't changed, so they aren't fail_to_pass. PASS_TO_PASS is empty. Configure downloads
  dependencies (benchmarks, competitors, simdjson-data) into /opt/simdjson-deps
  (simdjson_DEPENDENCY_CACHE_DIR), so later configures need no network; eval.sh builds from a fresh
  build/. Peeky's build (peeky.sh) leaves out Google Benchmark (its configure checks fail with
  libc++) and appends -Wno-error after the project's -Werror, as clang 18 warns in a header.
