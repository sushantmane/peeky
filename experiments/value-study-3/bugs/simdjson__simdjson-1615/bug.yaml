category: E
categories_applicable: [E, C]
category_rationale: >-
  The report says what is missing (JSON Pointer in the On Demand API) and points at the DOM
  implementation to port. The port has to respect On Demand's forward-only iteration, whose state
  is less simple.
traits: []
traits_rationale: >-
  It is an API addition, not a wrong value or crash, so not runtime-state. The build and test take
  seconds, and the new code runs a call or two below the test.
root_cause: >-
  The On Demand front end (include/simdjson/generic/ondemand/) has no JSON Pointer support:
  document, value, object and array have no at_pointer(std::string_view) method, and their
  simdjson_result wrappers don't forward one. The fix adds them, porting the DOM's RFC 6901 logic:
  object::at_pointer unescapes ~0 and ~1 in the key and finds the field, array::at_pointer parses
  a decimal index (no leading zeros, "-" is out of bounds) and walks to the element through a new
  array::at, and document and value dispatch on the JSON type, an empty pointer meaning the whole
  document. Malformed pointers give INVALID_JSON_POINTER, and indexes past the end
  INDEX_OUT_OF_BOUNDS.
test_hint: |-
  Configure with `cd /testbed && cmake -S . -B build -DSIMDJSON_DEVELOPER_MODE=ON` (GCC 11 is the default compiler here), then build a test with `cmake --build build --parallel 4 --target <name>` (sources in tests/, tests/dom/ and tests/ondemand/, each listed in its CMakeLists.txt).
  Run it with `ctest --test-dir build -R '^<name>$' --output-on-failure`.
