notes: >-
  Build follows Multi-SWE-bench's nlohmann/json recipe (cmake in build/, ctest) with the base
  image's GCC 13 in place of its gcc:7, limited to test-conversions, the binary of the test file
  the test patch changes, which ctest runs as test-conversions_default and test-conversions_all.
  fail_to_pass is those two n2p tests (with the test patch the binary doesn't compile at base).
  PASS_TO_PASS is empty. The bundled Catch 1.x sizes an array with SIGSTKSZ, which glibc 2.39 no
  longer defines as a constant: the image sets CXXFLAGS=-DCATCH_CONFIG_NO_POSIX_SIGNALS and eval.sh
  passes it to CMake, so Catch installs no crash handlers. Peeky's build (peeky.sh) also defines
  CATCH_CONFIG_CPP11_NO_SHUFFLE and _LIBCPP_ENABLE_CXX17_REMOVED_RANDOM_SHUFFLE: Catch's test
  shuffling doesn't compile with libc++ 18 otherwise. eval.sh builds from a fresh build/.
