notes: >-
  Build follows Multi-SWE-bench's nlohmann/json recipe (cmake in build/, json_test_data in build/,
  ctest) with the base image's GCC 13 in place of its gcc:7, limited to test-regression2, the
  binary of the test file the test patch changes. fail_to_pass is that n2p test (with the test
  patch it doesn't compile at base). PASS_TO_PASS is empty. The bundled doctest 2.4.4 sizes an
  array with SIGSTKSZ, which glibc 2.39 no longer defines as a constant: the image sets
  CXXFLAGS=-DDOCTEST_CONFIG_NO_POSIX_SIGNALS and eval.sh passes it to CMake, so doctest installs no
  crash handlers (a crash still fails the ctest test). The test data (v3.0.0) is pre-cloned in
  /opt/json_test_data, and eval.sh builds from a fresh build/.
