category: C
categories_applicable: [C, D]
category_rationale: >-
  The faulty data is the parent pointer of each element of the std::vector inside a json array,
  which goes stale when the vector reallocates. It shows only after a sequence of appends that
  outgrows the vector's capacity, followed by a copy that checks the invariant.
traits: [runtime-state]
traits_rationale: >-
  The report is an assertion failure (a crash), and the fix changes how the elements' parent
  pointers are kept across appends and inserts. The fixed code runs one call below the test's
  push_back, emplace_back and insert calls, in a fast build.
root_cause: >-
  With JSON_DIAGNOSTICS on, each element of a json array keeps a pointer to its parent
  (m_parent). basic_json::push_back and emplace_back (single_include/nlohmann/json.hpp, generated
  from include/nlohmann/json.hpp) set the parent of the appended element only, but when the
  std::vector reallocates, the moved elements lose theirs (the move constructor doesn't copy it),
  and insert() fixed up only the inserted range; a later invariant check, e.g. on copying the
  array, then fails its assertion. The fix records the capacity before an append and resets every
  element's parent when it changed, and makes insert_iterator reset all parents.
test_hint: |-
  Build a test with `cd /testbed && cmake -S . -B build && cmake --build build --parallel 4 --target test-<name>` (one target per test/src/unit-<name>.cpp; binaries in build/test/).
  Run it with `ctest --test-dir build -R '^test-<name>$' --output-on-failure`.
