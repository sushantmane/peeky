notes: >-
  JDK 21 as in Multi-SWE-bench's image (the base's OpenJDK instead of Zulu 21), TZ and locale for
  its JAVA_TOOL_OPTIONS. Gradle is offline via /root/.gradle/init.d/offline.gradle; eval.sh also
