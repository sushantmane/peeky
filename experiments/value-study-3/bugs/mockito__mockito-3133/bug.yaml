category: E
categories_applicable: [E]
category_rationale: >-
  A feature request with a clear model: the JUnit 5 extension already resolves @Mock parameters,
  and @Captor needs the same; the state involved is simple.
traits: []
traits_rationale: >-
  The fix adds support for a new use of an annotation (a missing feature), not a corrected value.
root_cause: >-
  Mockito's JUnit 5 MockitoExtension resolves only @Mock-annotated parameters (supportsParameter
  checks for Mock), and @Captor is declared with @Target(FIELD), so a test-method or constructor
  parameter `@Captor ArgumentCaptor<T>` neither compiles nor gets injected. The fix allows @Captor
  on parameters, adds CaptorAnnotationProcessor.process(Parameter) and
  GenericMaster.getGenericType(Parameter), and has MockitoExtension delegate parameter resolution to
  a composite of a @Mock and a @Captor parameter resolver.
test_hint: >-
  Mockito builds with its Gradle wrapper on JDK 21, offline: run a project's tests with
  `cd /testbed && ./gradlew --offline :<project>:test --tests <fully.qualified.TestClass>` (the core
  library is the root project, `:test`; `./gradlew --offline projects` lists the others).
