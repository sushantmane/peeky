  pass in Multi-SWE-bench's parser). Multi-SWE-bench's fail_to_pass is junit-jupiter:compileTestJava
  (the hidden test puts @Captor on parameters); fail_to_pass adds the dataset's n2p tasks of the
  changed test's project, junit-jupiter:testClasses and junit-jupiter:test (this project's build
  prints no per-test lines, so its test task stands for the tests). eval.sh runs only
  :junit-jupiter:test, filtered to the hidden test class, instead of `test`; pass_to_pass is
  limited to the Gradle tasks that run executes.
