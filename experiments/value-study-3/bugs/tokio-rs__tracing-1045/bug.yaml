notes: >-
  Rust 1.96 (the base image's toolchain) builds and tests it. tracing doesn't commit Cargo.lock
  and Multi-SWE-bench resolves afresh, so the image pins one resolution (Cargo 1.96,
  generate-lockfile, 2 November 2026; Cargo.lock here, version 4; git ignores it). The dataset's
  FAIL_TO_PASS and PASS_TO_PASS are empty and its n2p tests are from other binaries, so
  fail_to_pass is the two tests the test patch changes and pass_to_pass is empty, as the dataset
  gives it. eval.sh runs tracing-core's dispatch and global_dispatch tests, offline. The hidden
  tests don't compile at base (they pass &Dispatch).
