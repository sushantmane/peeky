category: E
categories_applicable: [E]
category_rationale: >-
  An API consistency request: set_global_default takes a Dispatch by value while set_default and
  with_default take &Dispatch. The change is clear from the report and the three signatures.
traits: []
traits_rationale: >-
  An API change (a parameter type), not a wrong runtime value; it builds and tests in well under
  3 minutes, and the changed function runs directly in the test.
root_cause: >-
  tracing_core::dispatcher::set_global_default (tracing-core/src/dispatcher.rs) takes its
  Dispatch by value, unlike set_default and with_default, which take &Dispatch. The fix makes it
  take &Dispatch and clone the subscriber it stores (match dispatcher.subscriber.clone()), and
  updates its callers in tracing (subscriber::set_global_default) and tracing-subscriber
  (fmt's try_init and util's try_init) and the doc examples to pass a reference.
test_hint: >-
  Run a crate's tests with `cd /testbed && cargo test -p <crate>` (e.g. `cargo test -p
  tracing`); one integration test file with `cargo test -p <crate> --test <file stem>` (in
  <crate>/tests/).
