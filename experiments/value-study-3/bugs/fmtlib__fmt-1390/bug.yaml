notes: >-
  Build follows Multi-SWE-bench's fmtlib/fmt recipe (cmake in build/, ctest; fmt defaults to a
  Release build as C++11) with the base image's GCC 13 for its gcc:latest, limited to format-test,
  the binary of the test file the test patch changes. fail_to_pass is that n2p test (at base its
  new case FormatTest.FormatUTF8Precision fails; the other 125 pass). pass_to_pass is limited to
  the tests eval.sh runs, so it is empty. eval.sh builds from a fresh build/. Peeky's build
