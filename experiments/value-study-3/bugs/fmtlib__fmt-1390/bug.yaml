id: fmtlib__fmt-1390
language: cpp
repo: fmtlib/fmt
source: Multi-SWE-bench
base_commit: d6eede9e085f0b36edcf0a2f6dff5f7875181019
upstream: https://github.com/fmtlib/fmt/pull/1390
category: E
categories_applicable: [E]
category_rationale: >-
  The report shows the truncated output, and the string writer's precision handling is a few
  readable lines. The state is a size and a string.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The report is wrong output, and the fix changes how the truncated size is computed. The fixed
  line runs in basic_writer::write, about eight calls below the test's fmt::format, through the
  format-string parser and the argument visitor.
root_cause: >-
  basic_writer::write(basic_string_view<Char>, specs) in include/fmt/format.h applies a precision
  by cutting the string to that many code units, so for a UTF-8 (char8_t) string it can cut a
  multi-byte code point in half: "{:.4}" of "cafés" gives "caf\xc3". The fix adds
  code_point_index(), which for char8_t strings finds the byte index of the nth code point (other
  character types keep min(n, size)), and truncates there.
test_hint: |-
  Build a test with `cd /testbed && cmake -S . -B build && cmake --build build --parallel 4 --target <name>-test` (sources in test/<name>-test.cc; binaries in build/bin/).
  Run it with `ctest --test-dir build -R '^<name>-test$' --output-on-failure`.
