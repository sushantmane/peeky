notes: >-
  fail_to_pass is FAIL_TO_PASS (regression-4582, a full-program test the test patch adds);
  pass_to_pass is limited to the 137 full-program tests of PASS_TO_PASS, the part of `make test`
  that eval.sh runs (test-full-programs-debug and -release; the rest of PASS_TO_PASS are gtest
  tests). Build follows Multi-SWE-bench's ponyc recipe with clang 18 (CC/CXX set in the image,
  as ponyc's Makefile looks for `clang` only) and `-Wno-error` in the debug C flags through the
  CMAKE_FLAGS variable its Makefile passes to cmake. `make libs` (LLVM 15.0.7 for AArch64,
  Google Test 1.12.1, Google Benchmark 1.7.1) is prebuilt in peeky-study/r3-ponyc-llvm:15.0.7
  (Dockerfile.llvm here, FROM peeky-study/base:1; make libs 7.9 min after a 7.4 min LLVM clone);
  build/libs links to it. The Peeky build (peeky.sh) is ponyc and its runtime at -O0 in
  build-peeky; the reach check compiles the test program with that ponyc, so the program links
  the -O0 runtime.
