id: elastic__logstash-16579
language: java
repo: elastic/logstash
source: Multi-SWE-bench
base_commit: 2866bf9e3cacf294508154869ac5a17ed73ea027
upstream: https://github.com/elastic/logstash/pull/16579
category: D
categories_applicable: [D]
category_rationale: >-
  The wrong tokens only appear after a particular sequence of calls: a buffer-full error on one
  extract call, then more data, with the token split across calls; the faulty state is what the
  tokenizer keeps between calls.
traits: [runtime-state]
traits_rationale: >-
  After a buffer-full error the tokenizer returns wrong tokens, and the fix changes what it keeps
  across extract calls (the pending fragment and whether an error was just raised).
root_cause: >-
  In logstash-core's BufferedTokenizerExt.extract, a size-limit overflow throws "input buffer full"
  but leaves the oversized fragment in the `input` accumulator and records nothing, so the next
  call joins that stale fragment with the new data instead of discarding the rest of the offending
  token up to the next delimiter; the size check also measures the incoming first segment rather
  than the accumulated token. The fix remembers that the error was raised, drops the offending
  fragment, skips the next data up to its first delimiter, and keeps the pending partial token in a
  separate buffer (which flush and empty? now use).
test_hint: >-
  Logstash builds with its Gradle wrapper on JDK 11, offline (JRuby and the gems are already
  installed): run logstash-core's Java tests with
  `cd /testbed && ./gradlew --offline :logstash-core:javaTests --tests <fully.qualified.TestClass>`.
  Don't run the root project's `clean`: it deletes vendor/, which can't be fetched again offline.
image: peeky-study/elastic__logstash-16579:control
build_minutes: 2.5
grade_minutes: 0.3
pass_to_pass_removed:
  - test: bootstrap
    reason: >-
      SKIPPED in this image: its own action (bundler install and lock) needs rubygems.org, so an
      init script skips it once the gems are installed.
  - test: downloadJRuby
    reason: SKIPPED offline (the JRuby archive is already downloaded).
notes: >-
  JDK 11 as in Multi-SWE-bench's image (the base's OpenJDK instead of Zulu 11), TZ and locale for
  its JAVA_TOOL_OPTIONS. Gradle is offline via /root/.gradle/init.d/offline.gradle, and
  /root/.gradle/init.d/bootstrapped.gradle skips the bootstrap task's own action (bundler, which
  needs the network) while vendor/bundle holds the gems; its dependencies still run. eval.sh runs
  only logstash-core's javaTests task, filtered to the three hidden test classes
  (BufferedTokenizerExt*), instead of `clean test`; pass_to_pass is limited to what that runs: the
  hidden classes' other tests and the Gradle tasks the run executes (task names are test names in
  Multi-SWE-bench's parser). The hidden test files are new; eval.sh removes them before applying
  the patch.
