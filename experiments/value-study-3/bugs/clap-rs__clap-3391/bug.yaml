notes: >-
  Rust 1.96 (the base image's toolchain). The repo has no Cargo.lock (git ignores it): the image's
  cargo fetch resolved one at build time, as Multi-SWE-bench's image did. `--package clap` is
  ambiguous (criterion's clap 2), so commands name the test target. Test command: Multi-SWE-bench
  runs `cargo test`; eval.sh runs the builder test target filtered to possible_values:: (the hidden
  test file), offline. pass_to_pass is limited to the 15 dataset PASS_TO_PASS tests under
  possible_values::. The n2p tests are in other files the patch doesn't change. Parser:
  Multi-SWE-bench's Rust parse_log.
