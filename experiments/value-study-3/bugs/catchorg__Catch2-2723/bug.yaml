notes: >-
  Build follows Multi-SWE-bench's catchorg/Catch2 recipe (cmake -DCATCH_DEVELOPMENT_BUILD=ON in
  build/, make, ctest) with the base image's GCC 13 and Python 3.12 for its gcc:latest. Test names
