category: D
categories_applicable: [D, E]
category_rationale: >-
  The panic needs a particular configuration: an option with a default value that sits under a
  custom help heading (App::help_heading, or a flattened derive struct with help_heading). The
  report's debug output points at the parser's default-value pass.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The report shows a crash (unwrap of a missing value), and the fix changes which options get
  their default values. The fixed code runs in the parser's default-value pass, five or more calls
  below get_matches_from.
root_cause: >-
  In src/parse/parser.rs, Parser::add_defaults iterates self.app.get_opts_with_no_heading(), which
  (src/build/app/mod.rs) yields only the options without a custom help heading. So an option
  declared under a help heading never receives its default value, value_of returns None, and the
  derive's generated code panics on unwrap. The fix adds App::get_opts and App::get_flags, which
  yield all options and flags, and add_defaults iterates get_opts().
test_hint: >-
  Run the tests with `cd /testbed && RUSTFLAGS=-Awarnings cargo test --test <name>` (e.g. `--test
  flags`; one test target per file in tests/), and the library's unit tests with `cargo test --lib`;
  the build cache was made with these RUSTFLAGS.
