category: D
categories_applicable: [D, B]
category_rationale: >-
  The record's fields are lost only after another type (a generic List) was spied first, and the
  faulty state is a per-thread flag the inline mock maker consults from instrumented constructors.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  A spied record returns null for a field it was built with, and the fix changes what the mock
  maker keeps per thread while it constructs a mock. The fixed predicate runs only from
  constructor advice that ByteBuddy weaves into instrumented classes, many calls below spy().
root_cause: >-
  InlineDelegateByteBuddyMockMaker keeps a thread-local boolean (mockitoConstruction) that is true
  while Mockito itself instantiates a mock or spy, and its isMockConstruction predicate, which the
  constructor advice of every instrumented class consults, then answers true for any type, not
  only for the class being mocked. Once another type's hierarchy has been instrumented (here by
  spying a List), constructors that should run normally are intercepted while the record spy is
  built, and its fields end up null. The fix keeps the class being mocked instead of a boolean, and
  the predicate intercepts only types assignable from it.
test_hint: >-
  Mockito builds with its Gradle wrapper on JDK 21, offline: run a project's tests with
  `cd /testbed && ./gradlew --offline :<project>:test --tests <fully.qualified.TestClass>` (the core
  library is the root project, `:test`; `./gradlew --offline projects` lists the others).
