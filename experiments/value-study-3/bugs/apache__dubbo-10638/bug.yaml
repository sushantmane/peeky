notes: >-
  Same image recipe as apache__dubbo-7041: JDK 17 and Maven as in Multi-SWE-bench's image (the
  base's OpenJDK 17 and Maven 3.8 instead of Ubuntu 22.04's), offline via /root/.m2/settings.xml.
  One addition: this version's surefire (3.0.0-M5, with the TCP fork node the pom configures)
  resolves the container's own host name, which a container with no network can't resolve from
  /etc/hosts, so the image installs libnss-myhostname and puts `myhostname` in nsswitch.conf's
  hosts line. Dubbo's NetUtils logs warnings with no network interface; the tests pass. eval.sh
  runs a clean `test` of dubbo-common only, limited to the hidden test class (PojoUtilsTest),
  instead of the whole project's `clean test`; pass_to_pass is therefore empty (the dataset's are
  other classes). fail_to_pass is the dataset's (the n2p classes are in other modules, which
  didn't run once dubbo-common's tests failed; the test patch changes none of them). Test names
  are classes, as in Multi-SWE-bench's parser.
