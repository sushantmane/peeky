category: E
categories_applicable: [E, B]
category_rationale: >-
  The report gives a unit test with the failing generalize/realize round trip of java.time values;
  the cause is in PojoUtils and CompatibleTypeUtils, though seeing why realize fails takes
  java.time's internals and JDK 17's module access.
traits: [runtime-state]
traits_rationale: >-
  A generalize/realize round trip of LocalDateTime, LocalDate or LocalTime throws instead of
  returning the value, and the fix changes how these values are generalized and parsed back.
root_cause: >-
  PojoUtils.generalize (dubbo-common) has no case for java.time's LocalDate, LocalDateTime and
  LocalTime, so it generalizes them like JavaBeans, into a map of their private fields, which
  PojoUtils.realize can't turn back into the type (on JDK 17 it can't make their private members
  accessible). CompatibleTypeUtils.compatibleTypeConvert also parses a string into LocalTime only
  through LocalDateTime.parse, so a plain time string fails. The fix generalizes the three types to
  their ISO strings, and parses strings shorter than a date-time with LocalTime.parse.
test_hint: >-
  Dubbo builds with Maven on JDK 17, offline (dubbo-common and the poms it needs are installed in
  ~/.m2): run a test of dubbo-common with
  `cd /testbed && mvn test -o -pl dubbo-common -Dtest=<TestClass>` (or `-Dtest=<TestClass>#<method>`).
image: peeky-study/apache__dubbo-10638:control
