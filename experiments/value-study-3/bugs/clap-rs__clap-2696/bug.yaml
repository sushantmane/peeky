category: D
categories_applicable: [D, C]
category_rationale: >-
  The wrong result needs a particular configuration and sequence: an option that takes multiple
  values, overrides itself, and is given twice. The faulty values are the parser's matched
  occurrences and their value vectors.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The report shows wrong values (or an error) for repeated occurrences, and the fix changes which
  values are kept when an option overrides itself. The fixed code runs in the parser's override
  pass, five or more calls below get_matches_from.
root_cause: >-
  In src/parse/parser.rs, Parser::remove_overrides skips the self-override for any argument with
  ArgSettings::MultipleValues, as well as for MultipleOccurrences and positional arguments. So an
  option that takes multiple values and lists itself in overrides_with is not reset when it occurs
  again: its earlier values are kept, or the second occurrence is rejected as an argument provided
  more than once. The fix drops the MultipleValues condition, so only MultipleOccurrences and
  positional arguments skip the self-override (src/build/arg/mod.rs's docs are updated to match).
test_hint: >-
  Run the tests with `cd /testbed && RUSTFLAGS=-Awarnings cargo test --test <name>` (e.g. `--test
  flags`; one test target per file in tests/), and the library's unit tests with `cargo test --lib`;
  the build cache was made with these RUSTFLAGS.
