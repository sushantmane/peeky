category_rationale: >-
  The report shows that renaming the superclass B to B1 makes the error go away, which points at a
  clash with @SuperBuilder's generated type parameter B; the names to avoid are gathered in one
  method per handler, with simple state.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The generated code is wrong because the set of names to avoid is computed without the extends
  and implements clauses, which the fix changes; the handler runs inside javac's annotation
  processing of the test input, which the test harness drives, far below the test method.
root_cause: >-
  HandleSuperBuilder (both the javac and the Eclipse handler) picks names for the builder's type
  parameters, B and C by default, that must not clash with type names the class uses; its
  gatherUsedTypeNames collects the class's type parameters, its name and its field types, but not
  the types in its extends and implements clauses. So for `class A extends B`, the builder declares
  a type parameter named B that shadows the superclass B, and the generated code no longer
  compiles. The fix adds the first name token of the extends clause and of each implements clause
  to the used names.
test_hint: >-
  Lombok builds with ant on JDK 11, offline: `cd /testbed && ant test.compile` compiles lombok and
  its tests, and `ant test.javacCurrent` runs the javac test suites.
