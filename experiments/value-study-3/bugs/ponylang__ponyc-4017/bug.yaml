  submodule commit and lib/ tree). The Peeky build (peeky.sh) is ponyc and libponyc.tests at -O0
  in build-peeky, configured as ponylang__ponyc-4057's, with the targets of
  ponylang__ponyc-3763's (a gtest failing test); C++ units use libstdc++, as the prebuilt LLVM and
  Google Test do.
