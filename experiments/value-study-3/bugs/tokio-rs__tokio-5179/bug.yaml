  n2p test the test patch adds. pass_to_pass is the dataset's PASS_TO_PASS limited to the tests
  eval.sh runs (the task_local_set binary, 6 tests). At base the test binary aborts (SIGABRT) when
  the new test's thread exits; base was graded 3 times, the new test never reported.
