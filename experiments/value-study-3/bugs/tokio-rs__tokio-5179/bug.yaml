category: D
categories_applicable: [D, C]
category_rationale: >-
  The panic needs a particular sequence: a Runtime and a LocalSet stored together in a
  thread_local, a task spawned on the LocalSet, then the thread's locals destroyed in an order
  where tokio's own thread-locals are already gone. The state spans the LocalSet's Rc'd context,
  its shared queue and task list, and the coop budget's thread-local.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  A crash ("cannot access a Thread Local Storage value during or after destruction"); the fix
  changes where the LocalSet keeps its task list and queue and how the budget is read when the
  thread-local is gone. The failing code runs in Drop impls during thread-local destruction at
  thread exit, after the test body returns.
root_cause: >-
  When a LocalSet (with a Runtime) lives in a thread_local, it is dropped during thread-local
  destruction. tokio/src/task/local.rs keeps the LocalSet's owned-task list in its Context and
  reaches it on task release through the CURRENT thread-local (CURRENT.with), and
  tokio/src/runtime/coop.rs reads the task budget through context::budget, which uses
  CONTEXT.with (tokio/src/runtime/context.rs); with those thread-locals already destroyed, .with
  panics with AccessError. The fix makes context::budget use try_with and has coop fall back to
  an unconstrained budget, and moves the owned tasks and local queue into a LocalState inside
  Shared, so release and drop no longer go through the CURRENT thread-local.
test_hint: >-
  Run an integration test file with `cd /testbed && cargo test --test <file stem>` (integration
  tests are in tokio/tests/, e.g. `cargo test --test sync_mpsc`); tokio's unit tests with
  `cargo test -p tokio --lib --features full`.
