  changes); the other n2p tests are in binaries or tests the patch doesn't change (the dataset's
  base-plus-test-patch run stopped at the failing binary). pass_to_pass is limited to the 56
  dataset PASS_TO_PASS tests in those two files. Parser: Multi-SWE-bench's Rust parse_log.
