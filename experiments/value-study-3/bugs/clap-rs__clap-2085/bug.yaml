category: E
categories_applicable: [E, D]
category_rationale: >-
  Trailing spaces in the long help output, from the padding that aligns help text in a column.
  The help writer's code that pads after an argument's name is found from the output; it shows
  only in long help (--help), where the text goes on the next line.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  The report shows wrong output (trailing spaces), and the fix changes how the spacing after an
  argument is computed. The padding is written in Help::val, five or more calls below
  try_get_matches_from on the help path.
root_cause: >-
  In src/output/help.rs, Help::val pads the space after an argument's flags and value names with
  spaces up to the longest argument (or a fixed indent with next-line help), to align the help
  text in a column, whether or not the help is long. In long help (--help, use_long) the help text
  goes on the next line, so each argument's line ends in trailing spaces. The fix skips the
  alignment when self.use_long is set.
test_hint: >-
  Run the tests with `cd /testbed && RUSTFLAGS=-Awarnings cargo test --test <name>` (e.g. `--test
  flags`; one test target per file in tests/), the library's unit tests with `cargo test --lib`,
  and the workspace's other crates with `cargo test -p <crate>` (clap_derive, clap_generate); the
  build cache was made with these RUSTFLAGS.
