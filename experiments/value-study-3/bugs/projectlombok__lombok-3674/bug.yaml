category: E
categories_applicable: [E, D]
category_rationale: >-
  The compiler's message names the two constructors that both match, and the handler's generated
  this(null, null) call is plain in its source; it shows only when another two-argument
  constructor takes two reference types (D).
traits: [hard-to-reach]
traits_rationale: >-
  The fix changes the generated code's argument expressions (typed nulls), a code template rather
  than a value computed or kept at run time, so not runtime-state; the handler runs inside javac's
  annotation processing of the test input, which the test harness drives, far below the test.
root_cause: >-
  @StandardException's handlers (javac and Eclipse) generate the no-argument and message-only
  constructors as calls to this(message, cause) with untyped null literals: this(null, null) and
  this(message, null). When the class has another two-argument constructor whose parameters are
  both reference types, such as one from @AllArgsConstructor, javac can't choose between it and
  (String, Throwable), and the generated call is ambiguous. The fix casts the nulls to
  java.lang.String and java.lang.Throwable in both generated calls.
test_hint: >-
  Lombok builds with ant on JDK 11, offline: `cd /testbed && ant test.compile` compiles lombok and
  its tests, and `ant test.javacCurrent` runs the javac test suites.
