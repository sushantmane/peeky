notes: >-
  JDK 11 per the SWE-bench spec (the project targets Java 1.6, which JDK 11's javac still
  accepts); its install step (`mvn clean install -pl gson -DskipTests -am`), then the test
  providers fetched by running the existing tests once. Maven 3.8 from the base instead of mvnd,
  offline via /root/.m2/settings.xml. eval.sh runs each test command even if an earlier one fails
  (the dataset chains them with &&).
