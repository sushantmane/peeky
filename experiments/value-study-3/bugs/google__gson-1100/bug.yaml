category: E
categories_applicable: [E]
category_rationale: >-
  The report's stack trace ends in DefaultDateTypeAdapter.write formatting a null Date; the cause
  is clear from reading the adapter's two short methods, with one null value as state.
traits: [runtime-state, hard-to-reach]
traits_rationale: >-
  Serializing a null Date crashes with a NullPointerException, and the fix changes how the adapter
  writes and reads a null value. In the report the adapter runs eight calls below Gson.toJson,
  through the reflective and runtime-type adapters.
root_cause: >-
  DefaultDateTypeAdapter (gson's adapter for the date format set with GsonBuilder.setDateFormat)
  doesn't handle null: write passes a null Date to DateFormat.format, which throws a
  NullPointerException, and read throws JsonParseException for any token that isn't a string,
  JSON null included. The fix writes JSON null for a null Date and reads JSON null back as null
  (other non-string tokens now fail in nextString).
test_hint: >-
  Gson builds with Maven on JDK 11, offline (the gson module and its parent are installed in
  ~/.m2): run a test with `cd /testbed && mvn test -o -pl gson -Dtest=<TestClass>#<method>`.
