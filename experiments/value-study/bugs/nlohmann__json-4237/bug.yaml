categories_applicable: [E]
category_rationale: >-
  The report pins the symptom (unsigned enums serialize as negative numbers) and the enum
  overload of to_json is short and readable; the state is a single json value of the wrong kind.
root_cause: >-
  The to_json overload for enum types (include/nlohmann/detail/conversions/to_json.hpp, mirrored
  in single_include/nlohmann/json.hpp) always stores the enum's underlying value with
  external_constructor<value_t::number_integer>, i.e. as a signed 64-bit number, even when the
  enum's underlying type is unsigned. Large unsigned values (e.g. 1<<63) therefore become
  negative numbers. The fix picks value_t::number_unsigned when the underlying type is unsigned.
