category: E
categories_applicable: [E, B]
category_rationale: >-
  The report says completion is broken for cp but not mv, and comparing the two utilities'
  clap argument definitions shows the missing settings; the state is a single argument spec.
  B also touches it, since the zsh script itself is generated by clap_complete.
root_cause: >-
  In src/uu/cp/src/cp.rs, uu_app() declares the positional PATHS argument with only
  ArgAction::Append, without `.num_args(1..)` and `.required(true)` (mv's FILES argument has
  both). clap therefore treats it as an optional single-value positional, so the generated zsh
  completion completes just one path (`'::paths:_files'`), and `cp` with no operands falls
  through to cp's own "missing file operand" error instead of clap's required-argument error.
  The fix adds `.num_args(1..)` and `.required(true)` to that argument.
test_hint: >-
  Build and run the tests with `cd /testbed && cargo test -- <filter>`; each utility's
  integration tests are in tests/by-util/test_<util>.rs (e.g. `cargo test -- test_ls`). The
  multicall binary is target/debug/coreutils (e.g. `target/debug/coreutils ls`).
