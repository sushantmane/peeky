categories_applicable: [D, A]
category_rationale: >-
  The wrong values only appear with the broker's result-level cache enabled, a groupBy with two or
  more post-aggregators, and a populate-then-read cache round trip; the faulty data is the result
  row rebuilt from the cached object.
root_cause: >-
  In GroupByQueryQueryToolChest's cache strategy, pullFromCache (result-level cache path) restores
  the post-aggregator values with a loop that never advances `postPos` (and never calls next() on
  the post-aggregator iterator), so every cached post-aggregator value is written into the first
  post-aggregator slot: that slot ends up with the last value and the other slots stay null. With a
  single post-aggregator it happens to work. The fix loops `postPos` over all post-aggregator specs.
test_hint: >-
  Druid builds with Maven on JDK 11, offline (the needed modules are already installed in ~/.m2):
  run a test with `cd /testbed && mvn test -o -pl processing -Dtest=<TestClass>#<method>`.
