category: D
categories_applicable: [D, C]
category_rationale: >-
  The wrong output needs a particular configuration: multiline search (-U) together with
  --replace, where the printer hands the replacer a buffer that extends past the match. The
  faulty values are byte ranges into the searcher's buffer and the regex captures.
root_cause: >-
  In crates/printer/src/util.rs, Replacer::replace_all calls the matcher's
  replace_with_captures_at(subject, range.start, ...), which ignores the end of the match range:
  it replaces every match from range.start to the end of `subject` and then copies the rest of
  `subject` after the last match into the output. In multiline mode the subject extends beyond
  the matched range, so the replacement output gains the following lines. The fix adds
  replace_with_captures_in_context, which stops at matches starting at or after range.end and
  copies the trailing bytes only up to range.end.
test_hint: >-
  Run the integration tests with `cd /testbed && RUSTFLAGS=-Awarnings cargo test --package
  ripgrep --test integration -- <filter>` (e.g. `-- misc::`); the build cache was made with these
  RUSTFLAGS. Crate tests: `cargo test -p grep-printer`. The debug binary is target/debug/rg.
