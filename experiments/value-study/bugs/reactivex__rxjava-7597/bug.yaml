category_rationale: >-
  The NPE needs a specific interleaving: the switchMap inner observer is disposed while it is still
  inside onSubscribe, and the upstream (scan) then emits synchronously from that same onSubscribe.
root_cause: >-
  In ObservableSwitchMap.SwitchMapInnerObserver, onSubscribe creates the inner `queue` only when
  DisposableHelper.setOnce succeeds, which it doesn't if the observer was already disposed
  (e.g. the downstream cancelled during subscription). onNext then still calls `queue.offer(t)`
  when `index == parent.unique`, dereferencing the null queue. The fix reads the queue into a
  local and only offers and drains when it is non-null.
test_hint: >-
