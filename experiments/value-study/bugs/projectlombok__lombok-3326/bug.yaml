category: B
categories_applicable: [B, D]
category_rationale: >-
  The crash is an NPE deep inside javac's type inference (Types.asSuper), caused by a type javac
  had cached before lombok changed the class; understanding it needs javac's symbol and erasure
  internals. It also needs a particular mix (generic method, overloads, inner class) to show.
root_cause: >-
  HandleUtilityClass (javac) makes the inner classes of a @UtilityClass static by setting
  Flags.STATIC and replacing the enclosing type of the inner class's ClassType with Type.noType.
  But javac may already have computed and cached the inner class symbol's erasure
  (Symbol.erasure_field, e.g. while checking the overloaded methods), and that cached erased type
  still has the outer class as its enclosing type; inference later uses it in Types.isSubtype/
  asSuper and hits a null symbol. The fix also clears innerClassSymbol.erasure_field so javac
  recomputes the erasure (and adds the field to lombok's javac stubs).
test_hint: >-
  Lombok builds with ant on JDK 11, offline: `cd /testbed && ant test.compile` compiles lombok and
  its tests, and `ant test.javacCurrent` runs the javac test suites.
