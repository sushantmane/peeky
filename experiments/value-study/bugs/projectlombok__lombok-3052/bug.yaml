category: B
categories_applicable: [B]
category_rationale: >-
  The wrong type comes from javac, not lombok: javac 9+ caches the speculative types of
  method-call arguments by source position (ArgumentAttr), so understanding the failure needs that
  compiler behaviour; nothing in lombok's code mentions types or inference.
root_cause: >-
  For a @Builder.Default field, HandleBuilder.generateDefaultProvider moves the field's initializer
  into a generated static `$default$<field>()` method, and the caller (HandleBuilder and
  HandleSuperBuilder) then runs recursiveSetGeneratedBy over the whole method, which also gives
  every node of the moved initializer the annotation's source position. javac's argument-type
  cache is keyed by tree position, so two different generic calls in the initializer (e.g.
  `MyClass.myInt()` and `MyClass.myChar()`) now share one cached type and compilation fails with
  incompatible types. The fix sets the generated-by positions before putting the original
  initializer back into the return statement, so the expression keeps its own positions.
test_hint: >-
  Lombok builds with ant on JDK 11, offline: `cd /testbed && ant test.compile` compiles lombok and
  its tests, and `ant test.javacCurrent` runs the javac test suites.
