notes: >-
  JDK 21 per the SWE-bench spec, Gradle 8.10 wrapper. gradle.properties (generated, git-ignored) is
  set to 4 workers and 4 test JVMs; Gradle is forced offline by /root/.gradle/init.d/offline.gradle.
  eval.sh applies SWE-bench's testLogging change at grading time, so the working tree is clean.
  The hidden test is added to lucene/test-framework's BaseGeoPointTestCase. Not A: a clean build
  plus the test class takes 24 s in a 4-CPU container. The tests are randomized (random seed per
  run); P2P passed in all three validation runs.
