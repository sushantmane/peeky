category: D
categories_applicable: [D, A]
category_rationale: >-
  It only shows for a very narrow polygon at the top of the latitude range, queried through the
  doc-values path, where the predicate's precomputed grid values sit near Integer.MAX_VALUE; the
  faulty data are those computed ints, which the report doesn't show.
root_cause: >-
  GeoEncodingUtils.Component2DPredicate.test (and DistancePredicate.test, which has the same check)
  rejects a point when `lat2 >= latBase + maxLatDelta`. For polygons close to latitude 90 the
  shifted encoded latitude base is near the top of the int range, so `latBase + maxLatDelta`
  overflows to a negative number and every point is rejected, so the doc-values query matches
  nothing. The fix compares `lat2 - latBase >= maxLatDelta` instead.
test_hint: >-
  Lucene builds with its Gradle wrapper on JDK 21, offline: run a test class with
  `cd /testbed && ./gradlew test --tests <fully.qualified.TestClass>`.
