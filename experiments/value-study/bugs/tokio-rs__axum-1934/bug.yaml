category_rationale: >-
  The panic needs a particular router configuration: a Router with a service nested at "/"
  used as another Router's fallback service, so that the outer fallback and the inner nested
  route both touch the matched-path request extensions.
root_cause: >-
  Router keeps its fallback in a second PathRouter (`fallback_router` in axum/src/routing/mod.rs),
  and PathRouter::call_with_state (axum/src/routing/path_router.rs) sets the MatchedPath request
  extension on every match, fallback matches included. When the fallback is itself a Router with a
  service nested at "/", the inner router records a nest-tail match and the debug_assert in
  set_matched_path_for_request (axum/src/extract/matched_path.rs) fires, because the outer
  fallback has already inserted a MatchedPath. The fix makes PathRouter generic over an
  IS_FALLBACK flag and doesn't set MatchedPath when routing through the fallback router.
test_hint: >-
  Run the axum unit tests with `cd /testbed && RUSTFLAGS=-Awarnings cargo test --package axum
  --lib -- <filter>` (e.g. `-- extract::path`); the build cache was made with these RUSTFLAGS.
