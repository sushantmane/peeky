category_rationale: >-
  A syntax error with no runtime state: the grammar in src/parser.y is readable and lacks the
  dotted form of `[]`. Build and tests take well under a minute.
root_cause: >-
  jq's grammar (src/parser.y, compiled into the checked-in src/parser.c) accepts a dot before
  bracket indexing (`Term '.' '[' Exp ']'`, so `.["a"].["b"]` parses), but has no production for
  a dot before the empty brackets that iterate, `Term '.' '[' ']'` and its `?` variant. So
  `.a.[]` and `.a.[]?` are syntax errors while `.a[]` works. The fix adds the two productions,
  emitting EACH and EACH_OPT exactly like `Term '[' ']'`.
test_hint: |-
  Build with `cd /testbed && make -j4` (bison regenerates src/parser.c from src/parser.y; the binary is ./jq).
  Run the test suite with `cd /testbed && make check`, or run individual test scripts under tests/.
