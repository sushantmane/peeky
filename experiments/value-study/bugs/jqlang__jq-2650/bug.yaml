notes: >-
  Build follows the SWE-bench spec (submodules, autoreconf -fi, configure
  --with-oniguruma=builtin, make). The report's own examples (`.["a"].["b"]`, `.a.["b"]`) already
  work at the base commit; what still fails is iteration after a dot (`.a.[]`), which is what the
  hidden test checks. Worth a decision: the agent may find the reported examples working.
