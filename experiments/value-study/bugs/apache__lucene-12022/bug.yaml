category: D
categories_applicable: [D, A]
category_rationale: >-
  The false positive needs a very flat polygon whose tessellated, quantized triangle collapses to a
  line segment, then a CONTAINS query against an intersecting line; the faulty edge flags live in
  decoded triangles, not in anything the report's inputs show directly.
root_cause: >-
  ShapeField.resolveTriangleType turns a decoded triangle with two identical vertices into a LINE
  (or POINT) but leaves the edge flags as they were: the line keeps the `ab` flag of the original
  first edge, which may be an internal tessellation edge, instead of taking the flag from the edges
  that survive the collapse. The CONTAINS query then sees no outer polygon edge crossing the query
  line and wrongly decides the polygon contains it. The fix merges the flags of the retained edges
  into `ab` in each collapse case.
test_hint: >-
  Lucene builds with its Gradle wrapper on JDK 17, offline: run a test class with
  `cd /testbed && ./gradlew test --tests <fully.qualified.TestClass>`.
