category_rationale: >-
  The bug only shows after a particular sequence across tasks: poll_expired must first return
  Pending and park a waker, then another task removes the last item. The state involved is the
  queue's stored waker alongside its slab and timer wheel.
root_cause: >-
  In tokio-util/src/time/delay_queue.rs, DelayQueue::remove (also used by try_remove) takes the
  entry out of the slab and the timer wheel but never wakes the waker that poll_expired stored in
  `self.waker` when it returned Pending. When the removed entry was the last one, the task waiting
  in poll_expired is never woken, although its next poll would return Ready(None). The fix wakes
  (and takes) the stored waker in remove when the slab becomes empty.
test_hint: >-
  Run an integration test file with `cd /testbed && cargo test --test <file stem>` (integration
  tests are in tokio/tests/ and tokio-util/tests/, e.g. `cargo test --test sync_mpsc`); unit tests
  of a crate with `cargo test -p tokio-util --lib`.
