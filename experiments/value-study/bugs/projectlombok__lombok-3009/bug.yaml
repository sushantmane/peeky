category: E
categories_applicable: [E]
category_rationale: >-
  The report names the config keys and the error message, which appears once in
  HandleFieldDefaults; the fix is a one-line guard and the state is a single record declaration.
root_cause: >-
  HandleFieldDefaults.visitType (both the javac and the Eclipse handler) applies the config-driven
  defaults lombok.fieldDefaults.defaultPrivate/defaultFinal to every type that isn't an interface
  or annotation, so records reach generateFieldDefaultsForType. That method only accepts a class or
  an enum and reports "@FieldDefaults is only supported on a class or an enum." even though no
  annotation was written. The fix returns early when there is no @FieldDefaults annotation and the
  type isn't a class or enum, so the config keys skip records.
test_hint: >-
  Lombok builds with ant on JDK 17, offline: `cd /testbed && ant test.compile` compiles lombok and
  its tests, and `ant test.javacCurrent` runs the javac test suites (some tests already fail at
  the base commit).
