category: D
categories_applicable: [D, C]
category_rationale: >-
  It needs a running cluster in which a primary fails and its replica takes over, and the wrong
  answer comes from which node of a shard's node list (cluster dict -> list -> clusterNode) is
  consulted. The server is built with -O3 and LTO.
root_cause: >-
  CLUSTER SHARDS (clusterCommandShards and addShardReplyForClusterShards in
  src/cluster_legacy.c) reports a shard's slot ranges from the slot_info_pairs of
  clusterNodeGetPrimary() applied to the first node in that shard's node list. After a failover
  that first node can be the old primary that failed: the other nodes still see it as a primary,
  but it no longer owns any slots, so its slot_info_pairs is NULL and the shard is reported with
  an empty "slots" array although the promoted replica serves them. The fix scans the shard's
  nodes for one that has slot info.
test_hint: |-
  Build with `cd /testbed && make -j4` (binaries in src/).
  Run tests with `cd /testbed && ./runtest --single unit/<suite>` (optionally `--only "<test name or /regex>"`); suites live under tests/.
