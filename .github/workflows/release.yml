name: Release

# Pushing a tag `vX.Y.Z` on a commit of `main` builds Peeky's wheel and sdist once, checks them
# against the tag and the changelog, publishes them to PyPI by trusted publishing, then creates
# the GitHub release with them. CONTRIBUTING.md has the steps, and the one-time setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: tag a commit of main"
            exit 1
          fi
      # No pip cache: what is published is built from fresh downloads only.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - name: Check that the tag names the built version
        id: version
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import email.parser, os, pathlib, re, sys, tarfile, zipfile

          dist = sorted(pathlib.Path("dist").iterdir())
          wheels = [p for p in dist if p.suffix == ".whl"]
          sdists = [p for p in dist if p.name.endswith(".tar.gz")]
          if len(wheels) != 1 or len(sdists) != 1 or len(dist) != 2:
              sys.exit(f"Expected one wheel and one sdist in dist/, found {[p.name for p in dist]}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              (path,) = [n for n in wheel.namelist() if re.fullmatch(r"[^/]+\.dist-info/METADATA", n)]
              wheel_meta = email.parser.Parser().parsestr(wheel.read(path).decode())
          with tarfile.open(sdists[0]) as sdist:
              (path,) = [n for n in sdist.getnames() if re.fullmatch(r"[^/]+/PKG-INFO", n)]
              sdist_meta = email.parser.Parser().parsestr(sdist.extractfile(path).read().decode())
          name, version = wheel_meta["Name"], wheel_meta["Version"]
          if (sdist_meta["Name"], sdist_meta["Version"]) != (name, version):
              sys.exit(f"The wheel is {name} {version}, the sdist {sdist_meta['Name']} {sdist_meta['Version']}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"The built version is {version}: a release is X.Y.Z")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"The tag is {tag}, but the built version is {version}: tag v{version}, or set peeky.__version__")
          print(f"name={name}")
          print(f"version={version}")
          print(f"{tag}: {name} {version}", file=sys.stderr)
          EOF
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # VERSION is X.Y.Z: escaping its dots makes it a pattern.
          if ! grep -qxE "## ${VERSION//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading '## $VERSION (YYYY-MM-DD)': add the section, with its release date"
            exit 1
          fi
          mkdir notes
          # The section `## VERSION (date)`, up to the next `## `. Relative links are made
          # absolute, at the tag, for the release page.
          awk -v version="$VERSION" '/^## / { if (found) exit; found = ($2 "" == version ""); next } found' CHANGELOG.md |
            sed -E "s|\]\(([^):#][^):]*)\)|](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)|g" > notes/release-notes.md
          if ! grep -q '[^[:space:]]' notes/release-notes.md; then
            echo "::error::CHANGELOG.md's section for $VERSION is empty"
            exit 1
          fi
          cat notes/release-notes.md
      - name: Install the wheel into a clean environment and exercise it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/peeky-release"
          "$RUNNER_TEMP/peeky-release/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          said=$("$RUNNER_TEMP/peeky-release/bin/peeky" --version)
          echo "$said"
          if [ "$said" != "peeky $VERSION" ]; then
            echo "::error::peeky --version says '$said', not 'peeky $VERSION'"
            exit 1
          fi
          for tool in peeky-worker peeky-agent peeky-probe; do
            "$RUNNER_TEMP/peeky-release/bin/$tool" --help > /dev/null
          done
          "$RUNNER_TEMP/peeky-release/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}/
    # Only this job can ask for an OIDC token, and it runs no code from the repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted publishing: PyPI accepts this workflow's OIDC token; there is no API token.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes/
      - name: Create the release, with the wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Peeky $VERSION" \
            --notes-file notes/release-notes.md
