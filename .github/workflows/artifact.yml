name: Build private artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest --durations=10
      - run: python -m build
      - name: Smoke-test distribution
        run: |
          python -m venv "$RUNNER_TEMP/peeky-artifact"
          "$RUNNER_TEMP/peeky-artifact/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/peeky-artifact/bin/peeky-worker" --help
          "$RUNNER_TEMP/peeky-artifact/bin/peeky-agent" --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peeky-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
