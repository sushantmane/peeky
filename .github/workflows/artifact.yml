name: Build artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest --durations=10
      - run: python -m build
      - name: Smoke-test distribution
        run: |
          python -m venv "$RUNNER_TEMP/peeky-artifact"
          "$RUNNER_TEMP/peeky-artifact/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/peeky-artifact/bin/peeky-worker" --help
          "$RUNNER_TEMP/peeky-artifact/bin/peeky-agent" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peeky-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
