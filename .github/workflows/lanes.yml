name: Linux lanes

# The lanes of scripts/ci_linux/run_lanes.sh in the CI image, as a laptop runs them, in seven
# jobs so that a failing job names its lanes. Buildkite runs this workflow on its hosted agents
# through its GitHub Actions compatibility, while GitHub Actions is paused by the account's
# billing limit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lanes:
    name: ${{ matrix.lanes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lanes:
          - quality unit wheel gdb-dap
          - integration
          - c c-gcc-llvm20
          - cpp cpp-llvm20
          - cpp-gcc cpp-gcc-llvm20
          - rust rust-llvm20
          - java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci_linux/docker_lanes.sh
        env:
          PEEKY_LANES: ${{ matrix.lanes }}
