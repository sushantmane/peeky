name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/unit --durations=10

  integration:
    name: integration (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/integration --durations=10

  java:
    name: Java headless conformance
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -e '.[dev]'
      - name: Build checksum-pinned experimental adapter
        run: python scripts/setup_java_adapter.py --output "$RUNNER_TEMP/peeky-java"
      - name: Exercise real JVM debugging
        run: PEEKY_JAVA_ADAPTER="$RUNNER_TEMP/peeky-java" pytest tests/java --durations=10

  native-c:
    name: C LLVM 18 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PEEKY_NATIVE_CC: /usr/bin/clang-18
      PEEKY_NATIVE_DAP: /usr/bin/lldb-dap-18
      PEEKY_NATIVE_DWARFDUMP: /usr/bin/llvm-dwarfdump-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Acquire LLVM 18 from signed Ubuntu repositories
        run: |
          started=$SECONDS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lldb-18 llvm-18
          dpkg-query -W clang-18 lldb-18 llvm-18
          echo "Native toolchain acquisition: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          test -x "$PEEKY_NATIVE_DAP"
          /usr/bin/lldb-18 --version
      - run: python -m pip install -e '.[dev]'
      - name: Exercise real C debugging and lifecycle
        run: |
          started=$SECONDS
          pytest tests/native --durations=10
          echo "Native conformance: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"

  native-cpp:
    name: C++ LLVM 18 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PEEKY_NATIVE_CXX: /usr/bin/clang++-18
      PEEKY_NATIVE_DAP: /usr/bin/lldb-dap-18
      PEEKY_NATIVE_DWARFDUMP: /usr/bin/llvm-dwarfdump-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Acquire LLVM 18 from signed Ubuntu repositories
        run: |
          started=$SECONDS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lldb-18 llvm-18
          dpkg-query -W clang-18 lldb-18 llvm-18
          echo "Native toolchain acquisition: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          test -x "$PEEKY_NATIVE_DAP"
          /usr/bin/lldb-18 --version
      - run: python -m pip install -e '.[dev]'
      - name: Exercise real C++ debugging and agent verification
        run: |
          started=$SECONDS
          pytest tests/cpp --durations=10
          echo "Native conformance: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"

  rust-probe:
    name: Rust 1.96 LLVM 18 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PEEKY_RUST_LINKER: /usr/bin/clang-18
      PEEKY_RUST_DAP: /usr/bin/lldb-dap-18
      PEEKY_RUST_DWARFDUMP: /usr/bin/llvm-dwarfdump-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Acquire LLVM 18 from signed Ubuntu repositories
        run: |
          started=$SECONDS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lldb-18 llvm-18
          dpkg-query -W clang-18 lldb-18 llvm-18
          echo "Native toolchain acquisition: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          test -x "$PEEKY_RUST_DAP"
          /usr/bin/lldb-18 --version
      - run: python -m pip install -e '.[dev]'
      - name: Install pinned dependency-free Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          echo "PEEKY_RUST_CARGO=$(rustup which --toolchain 1.96.0 cargo)" >> "$GITHUB_ENV"
          echo "PEEKY_RUST_RUSTC=$(rustup which --toolchain 1.96.0 rustc)" >> "$GITHUB_ENV"
      - name: Qualify raw Rust debugging and the experimental Rust worker
        run: |
          started=$SECONDS
          pytest tests/rust --durations=10 -rP
          echo "Rust conformance: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"

  remote:
    name: remote SSH e2e
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[dev]'
      - name: Debug a program on a second host through a real ssh -L tunnel
        env:
          PEEKY_E2E_DOCKER: "1"
          PEEKY_E2E_RECORD: ${{ runner.temp }}/remote-run.json
        run: |
          started=$SECONDS
          pytest tests/remote -v --durations=10
          echo "Remote SSH e2e: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json, os; r = json.load(open(os.environ["PEEKY_E2E_RECORD"])); print(json.dumps(r["environment"], indent=2)); [print(s["exit"], s["seconds"], s["step"]) for s in r["steps"]]'

  wheel:
    name: wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - name: Install wheel into clean environment and exercise entry points
        run: |
          python -m venv "$RUNNER_TEMP/peeky-wheel"
          "$RUNNER_TEMP/peeky-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/peeky-wheel/bin/python" -c 'import peeky.client; import peeky.dap'
          "$RUNNER_TEMP/peeky-wheel/bin/peeky-worker" --help
          "$RUNNER_TEMP/peeky-wheel/bin/peeky-agent" --help
          "$RUNNER_TEMP/peeky-wheel/bin/peeky-probe" --help
          "$RUNNER_TEMP/peeky-wheel/bin/peeky" --help
          "$RUNNER_TEMP/peeky-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
