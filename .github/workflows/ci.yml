name: CI

# The Linux lanes run in the CI image (scripts/ci_linux), as scripts/ci_linux/docker_lanes.sh
# runs them on a laptop. One job builds the image into the Actions cache; each lane job loads it
# from there, so the image is built once per change to its Dockerfile. Remote SSH e2e runs on the
# runner itself. The macOS lanes run on GitHub's Apple-silicon runners, with Xcode's toolchain,
# only while the repository is public.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

# Explicit bash runs each step with `-eo pipefail`, so a failed lane fails `docker_lanes.sh | tee`.
defaults:
  run:
    shell: bash

jobs:
  image:
    name: CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the CI image into the Actions cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/ci_linux
          cache-from: type=gha,scope=ci-linux
          cache-to: type=gha,scope=ci-linux,mode=max

  lanes:
    name: lanes (${{ matrix.lanes }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lanes: quality unit wheel gdb-dap java
            timeout: 30
          - lanes: integration
            timeout: 30
          - lanes: py311
            timeout: 45
          - lanes: py313
            timeout: 45
          - lanes: c c-gcc-llvm20
            timeout: 45
          - lanes: cpp cpp-llvm20
            timeout: 45
          - lanes: cpp-gcc cpp-gcc-llvm20
            timeout: 45
          - lanes: rust
            timeout: 60
          - lanes: rust-llvm20
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load the CI image from the Actions cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/ci_linux
          cache-from: type=gha,scope=ci-linux
          load: true
          tags: peeky-ci-linux
      - name: Run the lanes
        env:
          PEEKY_LANES: ${{ matrix.lanes }}
          PEEKY_CI_IMAGE: peeky-ci-linux
          PEEKY_LANE_LOGS_DIR: ${{ runner.temp }}/lane-logs
        run: scripts/ci_linux/docker_lanes.sh | tee "$RUNNER_TEMP/lanes.txt"
      - name: Each lane's result and time
        if: always()
        run: grep -E '^(PASS|FAIL) ' "$RUNNER_TEMP/lanes.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep failed lanes' whole logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-logs-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/lane-logs
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS (${{ matrix.lane }})
    # A private repository's macOS minutes count ten times against its Actions allowance; a
    # public repository's are free. These lanes run only while the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit integration
            tests: tests/unit tests/integration
            timeout: 30
          - lane: c
            setup: xcode
            tests: -m "not cpp" tests/native
            timeout: 30
          - lane: cpp
            setup: xcode
            tests: -m cpp tests/cpp tests/native
            timeout: 30
          - lane: rust
            setup: xcode rust
            tests: tests/rust
            timeout: 60
          - lane: java
            setup: java
            tests: tests/java
            timeout: 20
    env:
      # Xcode's lldb-dap reads memory, as LLVM 20's does: the tests expect values read whole.
      PEEKY_EXPECT_READ_MEMORY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Hide Homebrew, whose GCC Peeky isn't qualified with on macOS
        run: |
          # The image's Homebrew has g++-13, g++-14 and g++-15: the C++ cases would build with
          # one too. On macOS, Peeky is qualified with Apple clang only.
          path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/homebrew/' | paste -sd: -)
          echo "PATH=$path" >> "$GITHUB_ENV"
          PATH=$path python -c 'import sys; sys.path.insert(0, "tests"); from native_compilers import gcc, gxx; assert gcc() is None and gxx() is None, (gcc(), gxx())'
      - run: python -m pip install -e '.[dev]'
      - name: Xcode's lldb-dap, clang, llvm-dwarfdump and dsymutil, and the macOS SDK
        if: ${{ contains(matrix.setup, 'xcode') }}
        run: |
          {
            echo "PEEKY_NATIVE_DAP=$(xcrun --find lldb-dap)"
            echo "PEEKY_NATIVE_CC=$(xcrun --find clang)"
            echo "PEEKY_NATIVE_CXX=$(xcrun --find clang++)"
            echo "PEEKY_NATIVE_DWARFDUMP=$(xcrun --find llvm-dwarfdump)"
            echo "PEEKY_NATIVE_DSYMUTIL=$(xcrun --find dsymutil)"
            echo "PEEKY_NATIVE_SYSROOT=$(xcrun --show-sdk-path)"
          } | tee -a "$GITHUB_ENV"
          echo "Developer directory: $(xcode-select -p); macOS SDK $(xcrun --show-sdk-version)"
          "$(xcrun --find clang)" --version
          "$(xcrun --find lldb-dap)" --version
      - name: Rust 1.96.0, with Xcode's lldb-dap, linker and dsymutil
        if: ${{ contains(matrix.setup, 'rust') }}
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          {
            echo "PEEKY_RUST_CARGO=$(rustup which --toolchain 1.96.0 cargo)"
            echo "PEEKY_RUST_RUSTC=$(rustup which --toolchain 1.96.0 rustc)"
            echo "PEEKY_RUST_DAP=$PEEKY_NATIVE_DAP"
            echo "PEEKY_RUST_DWARFDUMP=$PEEKY_NATIVE_DWARFDUMP"
            echo "PEEKY_RUST_LINKER=$PEEKY_NATIVE_CC"
            echo "PEEKY_RUST_DSYMUTIL=$PEEKY_NATIVE_DSYMUTIL"
          } | tee -a "$GITHUB_ENV"
      - name: JDK 17, and the Java adapter built with it
        if: ${{ contains(matrix.setup, 'java') }}
        run: |
          # The image's default JDK is 21; Linux CI runs JDK 17.
          jdk=$JAVA_HOME_17_arm64
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
          PATH="$jdk/bin:$PATH" python scripts/setup_java_adapter.py --output "$RUNNER_TEMP/peeky-java"
          echo "PEEKY_JAVA_ADAPTER=$RUNNER_TEMP/peeky-java" >> "$GITHUB_ENV"
      - name: Run the ${{ matrix.lane }} tests
        run: |
          started=$SECONDS
          pytest ${{ matrix.tests }} --durations=10
          echo "macOS ${{ matrix.lane }}: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"

  remote:
    name: remote SSH e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[dev]'
      - name: Debug Python, Java, C, C++ and Rust programs on a second host through a real ssh -L tunnel
        env:
          PEEKY_E2E_DOCKER: "1"
          PEEKY_E2E_RECORD: ${{ runner.temp }}/remote-run.json
        run: |
          started=$SECONDS
          pytest tests/remote -v --durations=10
          echo "Remote SSH e2e: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          for record in "$PEEKY_E2E_RECORD" "${PEEKY_E2E_RECORD%.json}"-{java,native}.json; do
            python -c 'import json, sys; r = json.load(open(sys.argv[1])); print(json.dumps(r["environment"], indent=2)); [print(s["exit"], s["seconds"], s["step"]) for s in r["steps"]]' "$record"
          done
